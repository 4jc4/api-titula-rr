# A major é a MESMA da produção (LXC 20.50.2.224: PostgreSQL 16.13), e o
# PostGIS idem (3.4.x). Validar em 17/3.5 e implantar em 16/3.4 é apostar
# que nada mudou entre majors — e entre PostGIS 3.4 e 3.5 mudou.
# Se produção subir de major um dia, aqui e os dois jobs de CI sobem junto.
services:
  db:
    image: imresamu/postgis:16-3.4
    container_name: titula-rr-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardoso
      POSTGRES_PASSWORD: iteraima
      POSTGRES_DB: titularr
    # 5433 no HOST, 5432 dentro do container. Esta máquina roda o banco de
    # mais de um projeto, e todos queriam a 5432 — o sintoma da colisão é
    # cruel: o compose sobe "Healthy" mas a porta continua entregue ao outro
    # container, e o erro que aparece é `P1000: authentication failed`, como
    # se a senha estivesse errada. Porta por projeto elimina o revezamento.
    ports:
      - '5433:5432'
    volumes:
      - titula-rr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cardoso']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  titula-rr-db-data:
