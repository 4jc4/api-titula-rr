name: CD

on:
  workflow_dispatch:

concurrency:
  group: titula-rr-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on:
      - self-hosted
      - titula-rr-prod

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment environment
        run: |
          set -euo pipefail

          echo "===== RUNNER ====="
          whoami
          hostname

          echo
          echo "===== DEPLOY DIRECTORY ====="
          test -d /opt/titula-rr/api
          test -f /opt/titula-rr/api/docker-compose.yml
          test -f /opt/titula-rr/api/.env

          echo
          echo "===== DOCKER ====="
          docker version --format '{{.Server.Version}}'
          docker compose version

          echo
          echo "===== CURRENT CONTAINER ====="
          docker ps \
            --filter name=titula-rr-api \
            --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

          echo
          echo "Environment validated successfully."

      - name: Sync application files
        run: |
          set -euo pipefail

          echo "===== SYNC APPLICATION ====="

          rsync -rvc --delete \
            --no-owner \
            --no-group \
            --no-perms \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            ./ /opt/titula-rr/api/

      - name: Build and deploy
        working-directory: /opt/titula-rr/api
        run: |
          set -euo pipefail

          echo "===== BUILD ====="
          docker compose build api

          echo
          echo "===== DEPLOY ====="
          docker compose up -d --no-deps api

          echo
          echo "===== STATUS ====="
          docker compose ps

      - name: Health check
        run: |
          set -euo pipefail

          echo "===== HEALTH CHECK ====="

          for attempt in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:3000/api/health \
              >/tmp/titula-health.json; then
              cat /tmp/titula-health.json
              echo
              echo "API is healthy."
              exit 0
            fi

            echo "Attempt ${attempt}/30 failed; waiting..."
            sleep 2
          done

          echo "API failed health check."
          docker logs --tail 100 titula-rr-api
          exit 1
