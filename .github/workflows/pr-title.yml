name: PR Title

# .husky/pre-commit não valida a mensagem do commit de propósito (ver
# commitlint.config.mjs): Conventional Commits é exigido só no TÍTULO do PR,
# aqui.
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: só precisamos do commitlint instalado, sem rodar
      # o postinstall (prisma generate) — mais rápido, e sem precisar de
      # DATABASE_URL nem que seja dummy.
      - run: npm ci --ignore-scripts
      - name: Valida o título do PR (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint
