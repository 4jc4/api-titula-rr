name: Test self-hosted runner

on:
  workflow_dispatch:

# Este workflow só imprime informação do host: não precisa de token nenhum.
permissions: {}

jobs:
  test-runner:
    timeout-minutes: 5
    runs-on:
      - self-hosted
      - titula-rr-prod

    steps:
      - name: Informações do host
        run: |
          echo "===== USER ====="
          whoami

          echo
          echo "===== HOST ====="
          hostname

          echo
          echo "===== PWD ====="
          pwd

          echo
          echo "===== DOCKER ====="
          docker ps

          echo
          echo "===== DOCKER COMPOSE ====="
          docker compose version
